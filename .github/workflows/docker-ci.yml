name: Build, Test, and Push to GHCR

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Explicit permissions required to write packages to GHCR using GITHUB_TOKEN
permissions:
  contents: read
  packages: write

jobs:
  build-test-push:
    runs-on: blacksmith-8vcpu-ubuntu-2404

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------------------------------------------------
      # 1. TEST PHASE
      # -------------------------------------------------------------------
      - name: Set up Python for Testing
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Validate App Syntax and Configs
        run: |
          echo "=== Testing Workflow API JSON ==="
          python -m json.tool workflow_api.json > /dev/null
          
          echo "=== Testing Python Syntax ==="
          python -m py_compile server.py
          
          echo "✓ All pre-build checks passed!"

      # -------------------------------------------------------------------
      # 2. BUILD & PUSH PHASE
      # -------------------------------------------------------------------
      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v1

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short

      - name: Build and Push Docker Image
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Enable GitHub Actions caching for faster rebuilds
